project_name: dossier
version: 2

before:
  hooks:
    - go mod tidy
    - go test -v ./...

builds:
  -
    id: dossier-linux
    main: ./cmd/dossier/main.go
    binary: dossier
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  -
    id: dossier-archive
    builds: [dossier-linux]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    format: tar.gz
    files:
      - LICENSE
      - README.md
      - README.es.md
      - CHANGELOG.md
    wrap_in_directory: false

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

release:
  github:
    owner: aemonge
    name: dossier
  name_template: "v{{ .Version }}"
  draft: false
  prerelease: auto
  mode: replace

snapshot:
  name_template: "{{ incpatch .Version }}-next"
