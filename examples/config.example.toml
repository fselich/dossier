# Git diff syntax highlighting. Token values use Chroma/Pygments descriptors:
# "#RRGGBB", "bold #RRGGBB", "italic #RRGGBB bg:#RRGGBB", etc.
# Any Chroma v2 token name is accepted, including specific descendants such as
# KeywordDeclaration, NameFunction, LiteralStringEscape, and CommentPreproc.
[theme.chroma]
style = "github"

[theme.chroma.tokens]
Background = "bg:#ffffff"
Text = "#24292f"
Error = "#cf222e"
Comment = "italic #6e7781"
Keyword = "bold #cf222e"
Name = "#24292f"
NameBuiltin = "#953800"
NameFunction = "#8250df"
Literal = "#0a3069"
LiteralNumber = "#0550ae"
LiteralString = "#0a3069"
Operator = "#0550ae"
Punctuation = "#24292f"
GenericDeleted = "#82071e"
GenericInserted = "#116329"

# Select a built-in key base, then replace defaults only for named actions.
[keys]
style = "nvim"

# Keys use Bubble Tea names such as ctrl+d, shift+tab, pgdown, space, enter,
# esc, or one character.
[keys.viewer]
quit = ["Q"]
stage = ["s"]
info = ["?"]
back = ["q", "esc"]
previous = ["shift+tab"]
next = ["tab"]
right = ["L", "right"]
left = ["H", "left"]
next_diff = ["]"]
previous_diff = ["["]
proposal_tab = ["1"]
design_tab = ["2"]
specs_tab = ["3"]
tasks_tab = ["4"]
git_tab = ["5"]
next_tab = ["l"]
previous_tab = ["h"]
view_diff = ["d", "enter"]
down = ["j", "down"]
page_down = ["pgdown", "ctrl+d"]
up = ["k", "up"]
page_up = ["pgup", "ctrl+u"]
toggle_task = ["space"]
open = ["e"]

[keys.index]
filter = ["/"]
info = ["?"]
new = ["n"]
lifecycle = ["a"]
inspect = ["i"]
edit = ["e"]
validate = ["v"]
undo = ["u"]
back = ["q", "Q", "esc"]
down = ["j", "down"]
up = ["k", "up"]
open = ["enter"]
toggle = ["space"]
sort = ["s"]

[keys.filter]
cancel = ["esc"]
accept = ["enter"]
backspace = ["backspace"]

[keys.spec]
quit = ["Q"]
back = ["q", "esc"]
down = ["j", "down"]
up = ["k", "up"]
page_down = ["pgdown", "ctrl+d"]
page_up = ["pgup", "ctrl+u"]
previous_requirement = ["h"]
next_requirement = ["l"]

[keys.config]
back = ["q", "?", "esc"]
down = ["j", "down"]
up = ["k", "up"]
page_down = ["pgdown", "ctrl+d"]
page_up = ["pgup", "ctrl+u"]
