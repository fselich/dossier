# Dossier configuration
# Default path: ${XDG_CONFIG_HOME:-~/.config}/dossier/config.toml
# Every section is optional. Unspecified values inherit from the selected base.

[ui]
start_view = "index" # index (default) or change; explicit path launches bypass this

[theme]
base = "light" # none, dark, light, dracula, gruvbox-light-soft

# Every Dossier-owned color role. Values accept #RRGGBB or ANSI colors 0-255.
[theme.ui]
primary_fg = "0"
muted_fg = "8"
mid_fg = "8"
accent_blue = "4"
accent_yellow = "3"
accent_cyan = "6"
accent_green = "2"
accent_red = "1"
accent_magenta = "5"
active_bg = "4"
active_fg = "15"
view_background = "#ffffff"
diff_add_background = "#e6ffed"
diff_remove_background = "#ffeef0"

# Glamour Markdown starts from a built-in style. Any element below may override
# foreground and/or background. Supported element names are listed here.
[theme.glamour]
style = "light" # ascii, dark, light, pink, dracula, tokyo-night

[theme.glamour.elements.document]
foreground = "#24292f"
background = "#ffffff"

[theme.glamour.elements.block_quote]
foreground = "#57606a"

[theme.glamour.elements.paragraph]
foreground = "#24292f"

[theme.glamour.elements.list]
foreground = "#24292f"

[theme.glamour.elements.heading]
foreground = "#0969da"

[theme.glamour.elements.h1]
foreground = "#0550ae"

[theme.glamour.elements.h2]
foreground = "#0550ae"

[theme.glamour.elements.h3]
foreground = "#0969da"

[theme.glamour.elements.h4]
foreground = "#0969da"

[theme.glamour.elements.h5]
foreground = "#0969da"

[theme.glamour.elements.h6]
foreground = "#57606a"

[theme.glamour.elements.text]
foreground = "#24292f"

[theme.glamour.elements.strikethrough]
foreground = "#57606a"

[theme.glamour.elements.emph]
foreground = "#24292f"

[theme.glamour.elements.strong]
foreground = "#24292f"

[theme.glamour.elements.horizontal_rule]
